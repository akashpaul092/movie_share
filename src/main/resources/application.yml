server:
  # Render (and similar) set PORT; local dev can use SERVER_PORT or default 8081
  port: ${PORT:${SERVER_PORT:8081}}

spring:
  application:
    name: movie-share
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}

movieshare:
  cors:
    allowed-origin-patterns: ${MOVIESHARE_CORS_ALLOWED_ORIGIN_PATTERNS:*}
  rate-limit:
    room-create-per-hour: ${MOVIESHARE_RATE_LIMIT_ROOM_CREATE:20}
