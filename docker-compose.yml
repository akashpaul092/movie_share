services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: movieshare
      POSTGRES_PASSWORD: movieshare
      POSTGRES_DB: movieshare
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  pg_data:
